name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit:v1.29
        ports: ['1025:1025', '8025:8025']
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s --health-timeout 3s --health-retries 12
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: revuping_ci
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: revuping_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U revuping_ci -d revuping_ci"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      NX_DAEMON: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pull request checks
        if: github.event_name == 'pull_request'
        env:
          NX_BASE: ${{ github.event.pull_request.base.sha }}
          NX_HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm nx affected -t lint typecheck test --parallel=1
      - name: Full workspace checks
        if: github.event_name != 'pull_request'
        run: pnpm check
      - name: Sequential production builds
        run: pnpm build
      - name: Full native authentication bundle
        env:
          EXPO_PUBLIC_API_URL: https://api.example.test/api/v1
        run: pnpm nx run mobile:auth-native-bundle
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:web
      - run: pnpm e2e:admin
      - name: Apply reviewed API migrations
        env:
          DATABASE_URL: postgresql://revuping_ci:ephemeral_ci_only@127.0.0.1:5432/revuping_ci
        run: pnpm nx run api:migrate-deploy
      - name: API foundation end-to-end checks
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://revuping_ci:ephemeral_ci_only@127.0.0.1:5432/revuping_ci
          REDIS_URL: redis://127.0.0.1:6379/0
          CORS_ORIGINS: http://localhost:3000
          API_DOCS_ENABLED: 'false'
        run: pnpm e2e:api
      - name: Transactional schema integrity checks
        env:
          DATABASE_URL: postgresql://revuping_ci:ephemeral_ci_only@127.0.0.1:5432/revuping_ci
        run: pnpm nx run api:schema-check
      - name: Authentication, session and membership integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://revuping_ci:ephemeral_ci_only@127.0.0.1:5432/revuping_ci
          REDIS_URL: redis://127.0.0.1:6379/0
          CORS_ORIGINS: http://localhost:3000
          WEB_URL: http://localhost:3000
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: '1025'
          AUTH_RATE_NAMESPACE: rp:auth:test:ci
          API_DOCS_ENABLED: 'false'
          LOG_LEVEL: silent
        run: pnpm nx run api-e2e:auth-check
      - name: Browser authentication and workspace flow
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://revuping_ci:ephemeral_ci_only@127.0.0.1:5432/revuping_ci
          REDIS_URL: redis://127.0.0.1:6379/0
          CORS_ORIGINS: http://localhost:3010
          WEB_URL: http://localhost:3010
          API_INTERNAL_URL: http://127.0.0.1:3002/api/v1
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: '1025'
          AUTH_RATE_NAMESPACE: rp:auth:test:ci-browser
          API_DOCS_ENABLED: 'false'
          LOG_LEVEL: silent
        run: pnpm nx run api-e2e:web-auth-check --parallel=1
      - name: Public API connectivity checks
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://revuping_ci:ephemeral_ci_only@127.0.0.1:5432/revuping_ci
          REDIS_URL: redis://127.0.0.1:6379/0
          CORS_ORIGINS: http://localhost:3000,http://localhost:19006
          API_DOCS_ENABLED: 'false'
        run: pnpm nx run api-e2e:connectivity-check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: apps/*/test-output
