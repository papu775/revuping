name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pull request checks
        if: github.event_name == 'pull_request'
        env:
          NX_BASE: ${{ github.event.pull_request.base.sha }}
          NX_HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm nx affected -t lint typecheck test --parallel=1
      - name: Full workspace checks
        if: github.event_name != 'pull_request'
        run: pnpm check
      - name: Sequential production builds
        run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:web
      - run: pnpm e2e:admin
      - run: pnpm e2e:api
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: apps/*/test-output
